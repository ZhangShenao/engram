name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram -d engram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENROUTER_API_KEY: ""
      CHARACTER_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_character
      CONVERSATION_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_conversation
      MEMORY_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_memory
      HARNESS_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_harness
      GATEWAY_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_gateway
    steps:
      - uses: actions/checkout@v4

      - name: Create service databases
        env:
          PGPASSWORD: engram
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U engram -d engram -v ON_ERROR_STOP=1 -f scripts/init-postgres.sql

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: Quality checks
        if: always() && !cancelled()
        run: uv run --frozen python scripts/quality_report.py

      - name: Build web
        if: always() && !cancelled()
        working-directory: web
        run: npm run build

      - name: Comment quality report
        if: always() && !cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- engram-quality-report -->";
            let report = "工程质量报告没有生成。";
            if (fs.existsSync("reports/quality.md")) {
              report = fs.readFileSync("reports/quality.md", "utf8").trim();
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${report}\n\n[本次 CI](${runUrl})`;
            await core.summary.addRaw(report).write();

            const { owner, repo } = context.repo;
            let issueNumber = context.issue.number || null;
            if (!issueNumber && context.eventName === "push") {
              const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: context.sha,
              });
              issueNumber = pulls.data[0] ? pulls.data[0].number : null;
            }
            if (!issueNumber) return;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }
