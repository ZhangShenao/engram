name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram -d engram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENROUTER_API_KEY: ""
      CHARACTER_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_character
      CONVERSATION_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_conversation
      MEMORY_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_memory
      HARNESS_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_harness
      GATEWAY_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_gateway
    steps:
      - uses: actions/checkout@v4

      - name: Create service databases
        env:
          PGPASSWORD: engram
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U engram -d engram -v ON_ERROR_STOP=1 -f scripts/init-postgres.sql

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build
