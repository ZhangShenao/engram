name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram -d engram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: apache/kafka:4.2.2
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://127.0.0.1:9092,PLAINTEXT://kafka:19092
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
          KAFKA_NUM_PARTITIONS: "1"
        options: >-
          --hostname kafka
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s
    env:
      OPENROUTER_API_KEY: ""
      CHAT_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_chat
      CONTEXT_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_context
      MEMORY_DATABASE_URL: postgresql://engram:engram@127.0.0.1:5432/engram_memory
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v4

      - name: Create service databases
        env:
          PGPASSWORD: engram
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U engram -d engram -v ON_ERROR_STOP=1 -f scripts/init-postgres.sql

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: Quality checks
        if: always() && !cancelled()
        run: uv run --frozen python scripts/quality_report.py

      - name: Build web
        if: always() && !cancelled()
        working-directory: web
        run: npm run build

      - name: Comment quality report
        if: always() && !cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- engram-quality-report -->";
            let report = "工程质量报告没有生成。";
            if (fs.existsSync("reports/quality.md")) {
              report = fs.readFileSync("reports/quality.md", "utf8").trim();
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${report}\n\n[本次 CI](${runUrl})`;
            await core.summary.addRaw(report).write();

            const { owner, repo } = context.repo;
            let issueNumber = context.issue.number || null;
            if (!issueNumber && context.eventName === "push") {
              const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: context.sha,
              });
              issueNumber = pulls.data[0] ? pulls.data[0].number : null;
            }
            if (!issueNumber) return;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }
