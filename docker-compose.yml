# container_name 是 docker ps 里的名字。同一网络里的主机名仍是下面的服务名。
services:
  postgres:
    container_name: engram-postgres
    image: postgres:16
    environment:
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: engram
      POSTGRES_DB: engram
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - engram-pg:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram -d engram"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    container_name: engram-kafka
    image: apache/kafka:4.2.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://127.0.0.1:9092,PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - engram-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  llm-gateway:
    container_name: engram-llm-gateway
    build: .
    command: ["python", "-m", "llm_gateway_service.server"]
    environment:
      LLM_PORT: "18414"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-5}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    ports:
      - "18414:18414"
    healthcheck:
      test: ["CMD", "python", "-m", "llm_gateway_service.healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20

  memory:
    container_name: engram-memory
    build: .
    command: ["python", "-m", "memory_service.server"]
    environment:
      DATABASE_URL: postgresql://engram:engram@postgres:5432/engram_memory
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MEMORY_PORT: "18413"
      CONTEXT_TARGET: context:18411
      LLM_TARGET: llm-gateway:18414
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-5}
    ports:
      - "18413:18413"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "memory_service.healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20

  context:
    container_name: engram-context
    build: .
    command: ["python", "-m", "context_service.server"]
    environment:
      DATABASE_URL: postgresql://engram:engram@postgres:5432/engram_context
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CONTEXT_PORT: "18411"
      MEMORY_TARGET: memory:18413
      LLM_TARGET: llm-gateway:18414
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-5}
    ports:
      - "18411:18411"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      memory:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "context_service.healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20

  chat:
    container_name: engram-chat
    build: .
    command: ["python", "-m", "uvicorn", "chat_service.main:app", "--host", "0.0.0.0", "--port", "18410"]
    environment:
      DATABASE_URL: postgresql://engram:engram@postgres:5432/engram_chat
      CONTEXT_TARGET: context:18411
      MEMORY_TARGET: memory:18413
      WEB_ORIGIN: http://localhost:18415,http://127.0.0.1:18415
    ports:
      - "18410:18410"
    depends_on:
      postgres:
        condition: service_healthy
      context:
        condition: service_healthy
      memory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18410/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    container_name: engram-web
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      GATEWAY_URL: http://chat:18410
    ports:
      - "18415:18415"
    depends_on:
      chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18415').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  engram-pg:
  engram-kafka:
