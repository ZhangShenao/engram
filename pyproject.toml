[project]
name = "engram"
version = "0.1.0"
description = "Engram backend: gateway, character, conversation, memory, and harness services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "services/memory/tests",
    "services/harness/tests",
    "services/conversation/tests",
    "services/gateway/tests",
]
pythonpath = [
    "packages/engram_contracts",
    "services/memory",
    "services/harness",
    "services/character",
    "services/conversation",
    "services/gateway",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/engram_contracts",
    "services/character",
    "services/conversation",
    "services/gateway",
    "services/harness",
    "services/memory",
    "scripts",
]
extend-exclude = ["docs/model-training", "web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# These modules load .env before importing code that reads the environment at import time.
"services/*/*_service/main.py" = ["E402"]
"services/harness/harness_service/llm/openrouter.py" = ["E402"]
"services/memory/memory_service/domain/extractor.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
    "engram_contracts",
    "character_service",
    "conversation_service",
    "gateway_service",
    "harness_service",
    "memory_service",
]
